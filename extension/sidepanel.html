<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>YT Investor Research</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
  <main class="app">
    <header class="header">
      <h1 class="title">YT Investor Research</h1>
      <div class="subtitle">
        YouTube Investment Research Engine
      </div>
    </header>

    <section id="videoCard" class="card hidden">
      <div id="creator" class="creator"></div>
      <div id="videoTitle" class="video-title"></div>
    </section>

    <section id="results" class="card hidden"></section>

    <section id="placeholder" class="card">
      <div id="status" class="placeholder">
        Detecting YouTube video...
      </div>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
